# Kept in-repo so CI and reviewers can run it. Secrets come from environment variables only.
revenue_recon:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('RECON_DUCKDB_PATH', '../warehouse/recon.duckdb') }}"
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVENUE_RECON') }}"
      schema: gold
      threads: 4
