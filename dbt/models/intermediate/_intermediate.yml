version: 2

models:
  - name: int_fx_rates_daily
    description: Calendar-day FX rates with a 5-day fallback for weekends and holidays.
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, currency_code]
    columns:
      - name: usd_per_unit
        description: Null only when no rate was published in the previous 5 days.
        data_tests: [not_null]
  - name: int_gl_revenue_journals
    description: Revenue-side GL lines, one row per journal, numbered per sub-ledger batch.
    columns:
      - name: journal_id
        data_tests: [unique, not_null]
      - name: source_batch_id
        data_tests: [not_null]
